name: ripe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ripe
      POSTGRES_PASSWORD: ripe
      POSTGRES_DB: ripe
    ports:
      - "127.0.0.1:${RIPE_DB_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripe -d ripe"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres:
